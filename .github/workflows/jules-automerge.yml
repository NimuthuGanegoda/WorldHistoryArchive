name: Auto-merge Jules PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # specific check: Only run if the branch starts with "jules/"
    if: startsWith(github.head_ref, 'jules/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Enable Auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # This command tells GitHub: "Merge this PR automatically (squash)"
        run: gh pr merge --auto --squash "$PR_URL"
