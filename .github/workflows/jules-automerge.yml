name: Auto-merge Jules

on:
  pull_request:
    # ADDED: 'synchronize' and 'reopened' so it runs if you update the code too
    types: [opened, synchronize, reopened]

jobs:
  approve-and-merge:
    runs-on: ubuntu-latest
    # CHANGED: Now checks if 'jules' appears ANYWHERE in the branch name
    if: contains(github.head_ref, 'jules')
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash --delete-branch
