name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Runs at 19:00 UTC (00:30 Sri Lanka Standard Time) to ensure the daily rotation happens strictly after midnight
    - cron: '0 19 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          
      - name: Install dependencies
        run: npm ci
        
      - name: Enrich Kings Biographies
        run: node scripts/enrich-kings.js

      - name: Commit enriched data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/kings.json
          git commit -m "chore: Update Kings data with enriched biographies" || echo "No changes to commit"
          git push origin main || echo "No changes to push"

      - name: Build with Next.js
        run: npm run build
        env:
          NODE_ENV: production

      - name: Ensure CNAME in /out
        run: cp public/CNAME out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
