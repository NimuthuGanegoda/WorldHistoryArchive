{{define "content"}}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
      <h1 class="text-3xl sm:text-4xl font-extrabold brand-font gold-gradient-text mb-2">
        🗺️ Spatial Geography & 3D Celestial Atlas
      </h1>
      <p class="text-slate-400 text-sm">
        Interactive 3D planetary projection and cartographic atlas of ancient civilizations, dynasties, and archaeological wonders.
      </p>
    </div>

    <!-- Mode Switcher -->
    <div class="flex items-center gap-2 bg-slate-900/90 p-1.5 rounded-2xl border border-amber-500/20 w-fit">
      <button id="btn-3d-mode" class="px-4 py-2 text-xs font-bold rounded-xl bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20 transition-all flex items-center gap-1.5">
        <span>🌍</span> 3D Planetary Sphere
      </button>
      <button id="btn-2d-mode" class="px-4 py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
        <span>🗺️</span> 2D Carto Map
      </button>
    </div>
  </div>

  <!-- 3D Three.js Globe Container -->
  <div id="container-3d" class="glass-card rounded-3xl overflow-hidden border border-amber-500/25 p-2 shadow-2xl relative">
    <div id="globe-3d-viewport" class="w-full h-[720px] rounded-2xl relative bg-slate-950/80 cursor-grab active:cursor-grabbing overflow-hidden">
      <canvas id="atlas-globe-canvas" class="w-full h-full"></canvas>

      <!-- 3D UI Control Overlays -->
      <div class="absolute top-4 left-4 pointer-events-none flex flex-col gap-2">
        <div class="bg-slate-900/85 backdrop-blur px-3 py-1.5 rounded-full border border-amber-500/20 text-xs text-amber-400 font-semibold flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Three.js Spatial Engine • Drag to Rotate • Scroll to Zoom
        </div>
      </div>

      <!-- 3D Tooltip / Info Card on Hover/Click -->
      <div id="atlas-tooltip" class="absolute hidden pointer-events-auto transform -translate-x-1/2 -translate-y-full mb-4 px-4 py-3 rounded-2xl bg-slate-900/95 border border-amber-500/40 text-left shadow-2xl backdrop-blur transition-opacity duration-150 z-30 max-w-xs">
        <div class="flex items-center justify-between gap-3 mb-1">
          <span id="atlas-tooltip-badge" class="px-2 py-0.5 text-[10px] font-bold uppercase rounded bg-amber-500/20 text-amber-400 border border-amber-500/30">Site</span>
          <span id="atlas-tooltip-sub" class="text-[11px] text-slate-400 font-medium"></span>
        </div>
        <h4 id="atlas-tooltip-title" class="font-bold text-sm text-slate-100 mb-1"></h4>
        <p id="atlas-tooltip-desc" class="text-xs text-slate-300 line-clamp-2 mb-2 font-light leading-relaxed"></p>
        <a id="atlas-tooltip-link" href="#" class="inline-flex items-center gap-1 text-xs font-bold text-amber-400 hover:text-amber-300">
          Explore Detail &rarr;
        </a>
      </div>
    </div>
  </div>

  <!-- 2D Leaflet Map Container (Hidden by default) -->
  <div id="container-2d" class="glass-card rounded-3xl overflow-hidden border border-amber-500/20 p-2 shadow-2xl hidden">
    <div id="historyMap" class="w-full h-[720px] rounded-2xl z-10"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const btn3D = document.getElementById('btn-3d-mode');
  const btn2D = document.getElementById('btn-2d-mode');
  const container3D = document.getElementById('container-3d');
  const container2D = document.getElementById('container-2d');

  let leafletMapInitialized = false;

  btn3D.addEventListener('click', () => {
    container3D.classList.remove('hidden');
    container2D.classList.add('hidden');
    btn3D.className = 'px-4 py-2 text-xs font-bold rounded-xl bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20 transition-all flex items-center gap-1.5';
    btn2D.className = 'px-4 py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all flex items-center gap-1.5';
  });

  btn2D.addEventListener('click', () => {
    container2D.classList.remove('hidden');
    container3D.classList.add('hidden');
    btn2D.className = 'px-4 py-2 text-xs font-bold rounded-xl bg-amber-500 text-slate-950 shadow-md shadow-amber-500/20 transition-all flex items-center gap-1.5';
    btn3D.className = 'px-4 py-2 text-xs font-semibold rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all flex items-center gap-1.5';

    if (!leafletMapInitialized) {
      initLeafletMap();
      leafletMapInitialized = true;
    }
  });

  // --- 1. Three.js 3D Atlas Engine ---
  const canvas = document.getElementById('atlas-globe-canvas');
  const viewport = document.getElementById('globe-3d-viewport');
  const tooltip = document.getElementById('atlas-tooltip');
  const tooltipTitle = document.getElementById('atlas-tooltip-title');
  const tooltipSub = document.getElementById('atlas-tooltip-sub');
  const tooltipDesc = document.getElementById('atlas-tooltip-desc');
  const tooltipLink = document.getElementById('atlas-tooltip-link');
  const tooltipBadge = document.getElementById('atlas-tooltip-badge');

  if (!canvas || !viewport || !window.THREE) return;

  const width = viewport.clientWidth;
  const height = viewport.clientHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  camera.position.set(0, 30, 260);

  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.minDistance = 110;
  controls.maxDistance = 400;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.6;

  const globeGroup = new THREE.Group();
  scene.add(globeGroup);

  const GLOBE_R = 80;

  // Celestial Core Sphere
  const coreGeo = new THREE.SphereGeometry(GLOBE_R - 0.5, 64, 64);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0x050a14, transparent: true, opacity: 0.95 });
  const coreMesh = new THREE.Mesh(coreGeo, coreMat);
  globeGroup.add(coreMesh);

  // Wireframe Coordinate Grid
  const gridGeo = new THREE.SphereGeometry(GLOBE_R, 36, 36);
  const gridMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b, wireframe: true, transparent: true, opacity: 0.12 });
  const gridMesh = new THREE.Mesh(gridGeo, gridMat);
  globeGroup.add(gridMesh);

  // Atmospheric Glow
  const atmoGeo = new THREE.SphereGeometry(GLOBE_R * 1.15, 32, 32);
  const atmoMat = new THREE.MeshBasicMaterial({
    color: 0xf59e0b,
    transparent: true,
    opacity: 0.05,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending
  });
  scene.add(new THREE.Mesh(atmoGeo, atmoMat));

  // Helper: Spherical Coordinates to 3D Cartesian Vector
  function latLngToVec3(lat, lng, r) {
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lng + 180) * (Math.PI / 180);
    return new THREE.Vector3(
      -(r * Math.sin(phi) * Math.cos(theta)),
      r * Math.cos(phi),
      r * Math.sin(phi) * Math.sin(theta)
    );
  }

  const clickableObjects = [];
  const pulsingRings = [];

  // Fetch all Archaeological Sites & Civilizations
  Promise.all([
    fetch((window.WHA_BASE || '') + '/api/sites').then(r => r.json()),
    fetch((window.WHA_BASE || '') + '/api/countries').then(r => r.json())
  ]).then(([sites, countries]) => {
    // 1. Plot Archaeological Sites
    sites.forEach(site => {
      if (!site.coordinates || !site.coordinates.lat || !site.coordinates.lng) return;
      const pos = latLngToVec3(site.coordinates.lat, site.coordinates.lng, GLOBE_R);

      const pinGroup = new THREE.Group();
      pinGroup.position.copy(pos);
      pinGroup.lookAt(new THREE.Vector3(0, 0, 0));

      const pinHeadGeo = new THREE.SphereGeometry(1.5, 12, 12);
      const pinHeadMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
      const pinHead = new THREE.Mesh(pinHeadGeo, pinHeadMat);
      pinHead.userData = { type: 'site', data: site };
      pinGroup.add(pinHead);
      clickableObjects.push(pinHead);

      const beamGeo = new THREE.CylinderGeometry(0.2, 0.2, 6, 6);
      const beamMat = new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.8 });
      const beam = new THREE.Mesh(beamGeo, beamMat);
      beam.position.z = 3;
      beam.rotation.x = Math.PI / 2;
      pinGroup.add(beam);

      const pRing = new THREE.Mesh(
        new THREE.RingGeometry(1.8, 2.4, 16),
        new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide, transparent: true, opacity: 0.7 })
      );
      pRing.position.z = 0.4;
      pinGroup.add(pRing);
      pulsingRings.push(pRing);

      globeGroup.add(pinGroup);
    });

    // 2. Plot Ancient Trade Route Arcs across Civilizations
    const tradePairs = [
      ["china", "persia"],
      ["persia", "rome"],
      ["india", "sri-lanka"],
      ["egypt", "greece"],
      ["greece", "rome"]
    ];

    const cMap = {};
    countries.forEach(c => { cMap[c.slug] = c; });

    tradePairs.forEach(([fromSlug, toSlug]) => {
      const c1 = cMap[fromSlug];
      const c2 = cMap[toSlug];
      if (c1 && c2 && c1.center && c2.center) {
        const v1 = latLngToVec3(c1.center[0], c1.center[1], GLOBE_R);
        const v2 = latLngToVec3(c2.center[0], c2.center[1], GLOBE_R);
        const mid = v1.clone().add(v2).multiplyScalar(0.5).normalize().multiplyScalar(GLOBE_R * 1.22);

        const curve = new THREE.QuadraticBezierCurve3(v1, mid, v2);
        const points = curve.getPoints(30);
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const lineMat = new THREE.LineBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.35 });
        const arc = new THREE.Line(lineGeo, lineMat);
        globeGroup.add(arc);
      }
    });
  }).catch(err => console.error("Error loading 3D atlas data:", err));

  // Raycasting Interactions
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  function onPointerMove(e) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects);

    if (intersects.length > 0) {
      const obj = intersects[0].object;
      const meta = obj.userData;
      if (meta && meta.data) {
        controls.autoRotate = false;
        canvas.style.cursor = 'pointer';
        tooltip.classList.remove('hidden');
        tooltip.style.left = (e.clientX - rect.left) + 'px';
        tooltip.style.top = (e.clientY - rect.top) + 'px';

        const s = meta.data;
        tooltipTitle.textContent = s.name;
        tooltipSub.textContent = (s.country || '') + ' • ' + (s.kingdom || '');
        tooltipDesc.textContent = s.description || 'Archaeological site.';
        tooltipBadge.textContent = s.type || 'Monument';
        tooltipLink.href = (window.WHA_BASE || '') + '/sites/' + s.id;
        return;
      }
    }

    controls.autoRotate = true;
    canvas.style.cursor = 'grab';
  }

  function onPointerClick(e) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects);

    if (intersects.length > 0) {
      const s = intersects[0].object.userData.data;
      if (s && s.id) {
        window.location.href = (window.WHA_BASE || '') + '/sites/' + s.id;
      }
    }
  }

  canvas.addEventListener('mousemove', onPointerMove);
  canvas.addEventListener('click', onPointerClick);

  window.addEventListener('resize', () => {
    const w = viewport.clientWidth;
    const h = viewport.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  let pTimer = 0;
  function animate3D() {
    requestAnimationFrame(animate3D);
    controls.update();

    pTimer += 0.05;
    const s = 1 + Math.sin(pTimer) * 0.3;
    pulsingRings.forEach(r => r.scale.set(s, s, 1));

    renderer.render(scene, camera);
  }
  animate3D();

  // --- 2. Leaflet 2D Map Engine ---
  function initLeafletMap() {
    const urlParams = new URLSearchParams(window.location.search);
    const initialLat = parseFloat(urlParams.get('lat')) || 20.0;
    const initialLng = parseFloat(urlParams.get('lng')) || 40.0;
    const initialZoom = parseInt(urlParams.get('zoom')) || 3;

    const map = L.map('historyMap').setView([initialLat, initialLng], initialZoom);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a> & OpenStreetMap contributors',
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    fetch((window.WHA_BASE || '') + '/api/sites')
      .then(res => res.json())
      .then(sites => {
        sites.forEach(site => {
          if (site.coordinates && site.coordinates.lat && site.coordinates.lng) {
            const customIcon = L.divIcon({
              className: 'custom-map-pin',
              html: `<div style="background:#f59e0b; width:14px; height:14px; border-radius:50%; border:2px solid #0f172a; box-shadow:0 0 12px rgba(245,158,11,0.9);"></div>`,
              iconSize: [14, 14],
              iconAnchor: [7, 7]
            });

            const marker = L.marker([site.coordinates.lat, site.coordinates.lng], { icon: customIcon }).addTo(map);
            marker.bindPopup(`
              <div style="font-family:sans-serif; color:#0f172a; min-width:200px;">
                <h3 style="font-weight:bold; font-size:14px; margin-bottom:4px;">${site.name}</h3>
                <p style="font-size:12px; color:#475569; margin-bottom:8px;">${site.type} • ${site.kingdom} (${site.country || ''})</p>
                <a href="${(window.WHA_BASE || '')}/sites/${site.id}" style="display:inline-block; font-size:11px; font-weight:bold; color:#d97706; text-decoration:none;">View Details &rarr;</a>
              </div>
            `);
          }
        });
      })
      .catch(err => console.error("Error loading sites for 2D map:", err));
  }
});
</script>
{{end}}
