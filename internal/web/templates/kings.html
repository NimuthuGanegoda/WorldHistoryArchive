{{define "content"}}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="mb-10">
    <h1 class="text-3xl sm:text-4xl font-extrabold brand-font gold-gradient-text mb-3">
      Historical Monarchs & Rulers
    </h1>
    <p class="text-slate-400 max-w-2xl text-sm sm:text-base">
      Chronological index of recorded monarchs across ancient civilizations. Filter by kingdom or search by name.
    </p>
  </div>

  <!-- Filter & Search Bar -->
  <div class="flex flex-col sm:flex-row gap-4 mb-8">
    <div class="flex-1 relative">
      <input type="text" id="kingSearch" placeholder="Filter by monarch name or keywords..."
             value="{{.Query}}"
             class="w-full bg-slate-900/90 text-sm rounded-xl pl-10 pr-4 py-3 border border-slate-700/80 focus:outline-none focus:border-amber-500 text-slate-200 shadow-inner"
             oninput="filterKings()">
      <span class="absolute left-3.5 top-3.5 text-slate-500 text-sm">🔍</span>
    </div>

    <div class="sm:w-64">
      <select id="kingdomFilter" onchange="filterKings()"
              class="w-full bg-slate-900/90 text-sm rounded-xl px-4 py-3 border border-slate-700/80 focus:outline-none focus:border-amber-500 text-slate-200">
        <option value="">All Kingdoms ({{len .Kingdoms}})</option>
        {{range .Kingdoms}}
        <option value="{{.Slug}}" {{if eq $.SelectedKingdom .Slug}}selected{{end}}>{{.Title}}</option>
        {{end}}
      </select>
    </div>
  </div>

  <!-- Kings Grid -->
  <div id="kingsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {{range .Kings}}
    <a href="/kings/{{.Slug}}" 
       data-title="{{.Title}}" 
       data-kingdom="{{.Kingdom}}" 
       data-bio="{{.Biography}}"
       class="king-card glass-card p-6 rounded-2xl flex flex-col justify-between group">
      <div>
        <div class="flex items-start justify-between gap-4 mb-3">
          <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
            {{.Kingdom}}
          </span>
          <span class="text-xs font-medium text-slate-400">{{.Reign}}</span>
        </div>
        <h2 class="text-xl font-bold text-slate-100 group-hover:text-amber-400 transition-colors mb-2">
          {{.Title}}
        </h2>
        <p class="text-sm text-slate-400 line-clamp-3 leading-relaxed">
          {{.Biography}}
        </p>
      </div>
      <div class="mt-4 pt-4 border-t border-slate-800 flex items-center justify-between text-xs text-amber-400 font-medium">
        <span>View Full Biography</span>
        <span class="group-hover:translate-x-1 transition-transform">&rarr;</span>
      </div>
    </a>
    {{end}}
  </div>
</div>

<script>
function filterKings() {
  const q = document.getElementById('kingSearch').value.toLowerCase().trim();
  const k = document.getElementById('kingdomFilter').value.toLowerCase().trim();
  const cards = document.querySelectorAll('.king-card');

  cards.forEach(card => {
    const title = card.getAttribute('data-title').toLowerCase();
    const kingdom = card.getAttribute('data-kingdom').toLowerCase();
    const bio = card.getAttribute('data-bio').toLowerCase();

    const matchesQuery = !q || title.includes(q) || bio.includes(q);
    const matchesKingdom = !k || kingdom === k;

    if (matchesQuery && matchesKingdom) {
      card.style.display = 'flex';
    } else {
      card.style.display = 'none';
    }
  });
}
</script>
{{end}}
