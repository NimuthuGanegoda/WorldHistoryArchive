{{define "content"}}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="mb-10">
    <h1 class="text-3xl sm:text-4xl font-extrabold brand-font gold-gradient-text mb-3">
      Historical Realms & Kingdoms
    </h1>
    <p class="text-slate-400 max-w-2xl text-sm sm:text-base">
      Ancient sovereign realms, civilizational capitals, and dynastic periods cataloged with territorial context.
    </p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    {{range .Kingdoms}}
    <a href="/kingdoms/{{.Slug}}" class="glass-card p-6 rounded-2xl flex flex-col justify-between group">
      <div>
        <div class="flex items-center justify-between text-xs font-semibold text-amber-400 mb-2">
          <span>{{.Country}}</span>
          <span class="text-slate-400">{{.Reign}}</span>
        </div>
        <h2 class="text-2xl font-bold text-slate-100 group-hover:text-amber-400 transition-colors mb-2">
          {{.Title}}
        </h2>
        <p class="text-sm text-slate-400 line-clamp-4 leading-relaxed mb-4">
          {{.Description}}
        </p>
      </div>
      <div class="flex items-center justify-between text-xs text-slate-500 pt-3 border-t border-slate-800">
        <span>{{.RulerCount}} Monarchs Recorded</span>
        <span class="text-amber-400 font-semibold group-hover:translate-x-1 transition-transform">Explore &rarr;</span>
      </div>
    </a>
    {{end}}
  </div>
</div>
{{end}}
